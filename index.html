<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יומן עבודה</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-dark: #14264a;
    --light-blue: #DCE6F1;
    --paper: #FBFAF7;
    --line: #D8DEE8;
    --text: #26313f;
    --muted: #6b7a8d;
    --danger: #b5484d;
  }

  * { box-sizing: border-box; }

  #app-root {
    direction: rtl;
    font-family: 'Segoe UI', 'Rubik', Arial, sans-serif;
    color: var(--text);
    background: var(--paper);
    min-height: 100%;
    padding: 28px 20px 60px;
  }

  .wrap { max-width: 980px; margin: 0 auto; }

  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 3px solid var(--navy);
    padding-bottom: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .masthead h1 {
    font-size: 26px;
    margin: 0 0 4px;
    color: var(--navy);
    letter-spacing: 0.2px;
  }

  .masthead p {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
  }

  .masthead-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .seed-banner {
    background: #FFF7E6;
    border: 1px solid #F0C36D;
  }
  .seed-banner p {
    margin: 0 0 10px 0;
    font-size: 14px;
    color: #5c4a1a;
  }

  .export-btn {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }
  .export-btn:hover { background: var(--navy-dark); }
  .export-btn:active { transform: scale(0.98); }
  .export-btn:disabled { background: #a9b4c4; cursor: not-allowed; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(31,56,100,0.06);
  }

  .card h2 {
    font-size: 15.5px;
    color: var(--navy);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card h2::before {
    content: "";
    width: 4px;
    height: 16px;
    background: var(--navy);
    border-radius: 2px;
    display: inline-block;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .datetime-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 640px) {
    .datetime-row { grid-template-columns: 1fr; }
  }

  label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 600;
  }

  input[type="date"], input[type="time"], input[type="text"], textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fdfdfc;
    direction: rtl;
  }
  textarea { resize: vertical; min-height: 44px; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(31,56,100,0.12);
  }

  .add-row {
    margin-top: 16px;
    display: flex;
    justify-content: flex-start;
  }

  .add-btn {
    background: var(--light-blue);
    color: var(--navy);
    border: 1px solid #b9cae3;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-btn:hover { background: #cfe0f2; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    background: var(--navy);
    color: #fff;
    padding: 10px 8px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 600;
  }
  tbody td {
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    text-align: right;
  }
  tbody tr:nth-child(even) { background: #f5f8fc; }
  tbody tr:hover { background: var(--light-blue); }

  .col-date { white-space: nowrap; font-weight: 600; width: 90px; }
  .col-time { white-space: nowrap; width: 70px; text-align: center; }
  .col-actions { width: 62px; text-align: center; white-space: nowrap; }

  .del-btn, .edit-btn {
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 4px;
  }
  .del-btn { color: var(--danger); }
  .del-btn:hover { background: #fbe6e7; }
  .edit-btn { color: var(--navy); }
  .edit-btn:hover { background: var(--light-blue); }

  tr.editing-row { background: #fff3cd !important; }

  .cancel-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    margin-right: 10px;
  }
  .cancel-btn:hover { background: #f2f2f2; }

  .upload-card { border: 1.5px dashed #b9cae3; background: #f7fafd; }

  .upload-block {
    padding: 12px 0;
    border-bottom: 1px dashed #d6e2ef;
  }
  .upload-block:last-of-type { border-bottom: none; }

  .upload-block-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 8px;
  }

  .upload-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  input[type="file"] {
    font-size: 13px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    max-width: 100%;
  }

  .img-preview-thumb {
    height: 64px;
    border-radius: 6px;
    border: 1px solid var(--line);
    object-fit: cover;
  }

  .ocr-btn {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .ocr-btn:hover { background: var(--navy-dark); }
  .ocr-btn:disabled { background: #a9b4c4; cursor: not-allowed; }

  .ocr-status {
    font-size: 13px;
    color: var(--muted);
  }
  .ocr-status.error { color: var(--danger); }

  .review-table-wrap { margin-top: 16px; }
  .review-table-wrap table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .review-table-wrap th { background: #eef3fa; color: var(--navy); padding: 7px; font-size: 12px; text-align: center; }
  .review-table-wrap td { padding: 7px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
  .review-table-wrap .col-check { width: 30px; text-align: center; }

  .commit-btn {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .commit-btn:hover { background: var(--navy-dark); }
  .commit-btn:disabled { background: #a9b4c4; cursor: not-allowed; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .status-msg {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 8px;
    min-height: 16px;
  }
  .status-msg.error { color: var(--danger); }

  .field-with-mic {
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  .field-with-mic textarea,
  .field-with-mic input {
    flex: 1;
  }
  .mic-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: background 0.15s, border-color 0.15s;
  }
  .mic-btn:hover { background: #f0f2f6; }
  .mic-btn.recording {
    background: var(--danger, #c0392b);
    border-color: var(--danger, #c0392b);
    color: #fff;
    animation: pulse 1.2s infinite;
  }
  .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
    100% { box-shadow: 0 0 0 0 rgba(192,57,43,0); }
  }

  .quick-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .quick-chip {
    background: #eef3fa;
    color: var(--navy);
    border: 1px solid #cfe0f2;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .quick-chip:hover { background: var(--light-blue); }
  .quick-chip.duplicate { background: #fff; color: var(--muted); border-style: dashed; }

  .time-with-now {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .time-with-now input { flex: 1; min-width: 0; }
  .now-btn {
    flex-shrink: 0;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--navy);
    font-size: 11.5px;
    font-weight: 600;
    padding: 0 10px;
    height: 38px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .now-btn:hover { background: var(--light-blue); }

  .summary-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .summary-pill {
    background: #f5f8fc;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .summary-pill b { display: block; color: var(--navy); font-size: 16px; }

  .secondary-btn { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .secondary-btn:hover { background: var(--light-blue); }
  .link-btn {
    background: none; border: none; color: var(--muted);
    font-size: 12.5px; cursor: pointer; text-decoration: underline; padding: 6px 4px;
  }
  .analysis-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; }
  .analysis-block { margin-top: 14px; }
  .analysis-block h3 { font-size: 14px; color: var(--navy); margin: 0 0 8px; }
  .owner-group { margin-bottom: 12px; }
  .owner-group b { color: var(--navy); }
  .owner-group ul { margin: 4px 0 0; padding-inline-start: 20px; font-size: 13px; }
  .owner-group li { margin-bottom: 3px; }
  .ai-text {
    font-size: 13.5px; line-height: 1.65; white-space: pre-wrap;
    background: #f9fafc; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  }
  .analysis-loading { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .analysis-error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .analysis-checkbox-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--muted); margin-top: 12px;
  }

  .save-reminder {
    display: none;
    background: #fdecea;
    color: #b3261e;
    border: 1px solid #f5c2c0;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13.5px;
    margin-bottom: 14px;
  }

  .month-filter-select {
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    color: var(--navy);
    background: #fff;
    cursor: pointer;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .sync-badge {
    font-size: 12.5px;
    font-weight: 600;
  }
  .sync-badge.sync-online { color: #2e7d4f; }
  .sync-badge.sync-connecting { color: var(--muted); }
  .sync-badge.sync-offline { color: var(--danger); }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .masthead { flex-direction: column; align-items: flex-start; }
    .export-btn { width: 100%; justify-content: center; }
  }
</style>
</head>

  function saveDraft() {

      clearDraft();

    const draft = {};

    draft.savedAt = new Date().toISOString();
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));

    try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
  }

  function restoreDraftIfAny() {
    let draft;
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      draft = JSON.parse(raw);
    } catch (e) { return; }
    if (!draft || (!draft['f-activity'] && !draft['f-who'] && !draft['f-conclusions'])) return;
    DRAFT_FIELD_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el && draft[id] !== undefined) el.value = draft[id];

    setStatus('שוחזרה טיוטה שלא נשמרה מהפעם הקודמת — בדקי ולחצי "הוסף" כדי לשמור ✓', false);
    updateSaveReminder();
  }

  function getDaysSinceBackup() {
    let refIso = null;
    try { refIso = localStorage.getItem(LAST_BACKUP_KEY); } catch (e) { /* ignore */ }

      const list = sortedEntries();
      if (!list.length) return null;
      refIso = list[0].date; // earliest entry date, as a fallback reference point
    }
    const refDate = new Date(refIso);
    if (isNaN(refDate.getTime())) return null;
    const diffMs = Date.now() - refDate.getTime();
    return Math.floor(diffMs / (1000 * 60 * 60 * 24));
  }

  function dismissBackupReminder() {
    backupReminderDismissed = true;

    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const seed = Array.isArray(window.__SEED_ENTRIES__) ? window.__SEED_ENTRIES__ : [];
      if (raw) {
        entries = JSON.parse(raw);

        // offer to import it instead of silently overwriting what's already on this device.
        if (seed.length) {
          seedBannerEntries = seed;

      } else if (seed.length) {
        entries = seed.slice();
        saveEntries();
        setStatus(`נטענו ${entries.length} רשומות מתוך הקובץ ✓`, false);
      } else {
        entries = [];
      }
    } catch (e) {
      entries = [];
    }
    loaded = true;
    render();
    initFirebaseSync();
  }

  function importSeedBanner() {

    if (!ok) return;
    entries = seedBannerEntries.slice();
    seedBannerEntries = null;
    saveEntries();
    setStatus('הנתונים מהקובץ יובאו ✓', false);
    render();

  function dismissSeedBanner() {

    if (fbEnabled && fbEntriesRef) {

    const el = document.getElementById('status-msg');
    if (!el) return;
    el.textContent = msg;

    if (!isError && msg) {
      setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2500);

    entries.forEach(e => whoTokens(e.who).forEach(n => set.add(n)));

    const counts = {};
    entries.forEach(e => whoTokens(e.who).forEach(n => { counts[n] = (counts[n] || 0) + 1; }));
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, limit);

    setStatus('שוכפלו הפרטים מהרשומה האחרונה — ניתן לערוך ולהוסיף ✓', false);

  // ---- Quick rule-based analysis: scans conclusions/activity text for open-item keywords ----
  const OPEN_ITEM_KEYWORDS = ['לבדוק', 'לתאם', 'לברר', 'ממתין', 'טרם', 'עדיין לא', 'יש לוודא', 'צריך', 'לשלוח', 'לעדכן', 'לסגור', 'להשלים', 'נדרש', 'לאתר'];

  function runQuickAnalysis() {
    analysisError = '';
    const list = sortedEntries();
    const byWho = {};
    list.forEach(e => {
      const text = [e.conclusions, e.activity].filter(Boolean).join('. ');
      const sentences = text.split(/[\.\n]+/).map(s => s.trim()).filter(Boolean);
      sentences.forEach(s => {
        if (OPEN_ITEM_KEYWORDS.some(k => s.includes(k))) {
          const owners = whoTokens(e.who).length ? whoTokens(e.who) : ['ללא שיוך'];
          owners.forEach(owner => {
            if (!byWho[owner]) byWho[owner] = [];
            if (!byWho[owner].some(item => item.text === s)) {
              byWho[owner].push({ date: e.date, text: s });
            }
          });
        }
      });
    });
    const owners = Object.keys(byWho).sort((a, b) => byWho[b].length - byWho[a].length);
    if (!owners.length) {
      analysisResultHtml = '<div class="empty-state">לא זוהו משימות פתוחות בטקסט הקיים. ניסוח מסקנות עם מילים כמו "לבדוק" / "לתאם" / "ממתין ל" יעזור לזיהוי האוטומטי.</div>';
      analysisResultText = '';
      render();
      return;
    }
    let html = '<div class="analysis-block"><h3>משימות פתוחות לפי גורם</h3>';
    let text = 'משימות פתוחות לפי גורם (זיהוי אוטומטי):\n';
    owners.forEach(owner => {
      html += `<div class="owner-group"><b>${escapeHtml(owner)}</b><ul>`;
      text += `\n${owner}:\n`;
      byWho[owner].forEach(item => {
        html += `<li>${escapeHtml(fmtDateDisplay(item.date))} — ${escapeHtml(item.text)}</li>`;
        text += `- ${fmtDateDisplay(item.date)}: ${item.text}\n`;
      });
      html += '</ul></div>';
    });
    html += '</div>';
    analysisResultHtml = html;
    analysisResultText = text;
    render();
  }

  function sortedEntries() {
    return [...entries].sort((a, b) => {
      const da = a.date || '', db = b.date || '';
      if (da !== db) return da.localeCompare(db);
      return (a.time || '').localeCompare(b.time || '');
    });
  }

    document.getElementById('f-conclusions').value = '';

  function addEntry() {
    const date = document.getElementById('f-date').value;
    const time = document.getElementById('f-time').value;
    const endTime = document.getElementById('f-end-time').value;
    const activity = document.getElementById('f-activity').value.trim();
    const who = document.getElementById('f-who').value.trim();
    const conclusions = document.getElementById('f-conclusions').value.trim();

    if (!date || !activity) {
      setStatus('נא למלא לפחות תאריך ופעילות.', true);
      return;
    }

    if (editingId) {
      const idx = entries.findIndex(e => e.id === editingId);
      if (idx !== -1) {
        entries[idx] = { ...entries[idx], date, time, endTime, activity, who, conclusions };
      }
      editingId = null;
      setStatus('הרשומה עודכנה ✓', false);
    } else {
      entries.push({ id: uid(), date, time, endTime, activity, who, conclusions });
    }

    saveEntries();
    clearForm();
    clearDraft();
    document.getElementById('f-activity').focus();
    render();
  }

    return JSON.stringify(data)
      .replace(/</g, '\\u003c')
      .replace(/>/g, '\\u003e')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');

  const HEBREW_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  function guessYear(month) {
    const now = new Date();
    const curYear = now.getFullYear();
    const curMonth = now.getMonth() + 1;
    // if the mentioned month is more than ~2 months "in the future" relative to now, assume it was last year
    return (month - curMonth > 2) ? curYear - 1 : curYear;
  }

  function normalizeDateToken(dPart, mPart, yPart) {
    const d = parseInt(dPart, 10);
    const m = parseInt(mPart, 10);
    if (!d || !m || d > 31 || m > 12) return '';
    let y;
    if (yPart) {
      y = parseInt(yPart, 10);
      if (yPart.length === 2) y += 2000;
    } else {
      y = guessYear(m);
    }
    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  function handleDocxSelect(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    docxError = '';
    docxFileName = file.name;
    docxLoading = true;
    reviewEntries = null;
    render();

    // Step 1: sniff the file as text. Our own export (.doc) is actually an HTML file,
    // so if it looks like HTML we can parse it directly — no need for mammoth at all.
    const textReader = new FileReader();
    textReader.onload = () => {
      const sniff = (textReader.result || '').slice(0, 500).trim().toLowerCase();
      const looksLikeHtml = sniff.startsWith('<') && (sniff.includes('<html') || sniff.includes('<table') || sniff.includes('<!doctype'));

      if (looksLikeHtml) {
        finishWithHtmlText(textReader.result);
      } else {
        // Real binary .docx (zip/OOXML) — read as arraybuffer and use mammoth
        readAsBinaryDocx(file);
      }
    };
    textReader.onerror = () => readAsBinaryDocx(file);
    textReader.readAsText(file, 'utf-8');
  }

  function finishWithHtmlText(htmlText) {
    const parsedFromTable = tryParseOwnTable(htmlText);
    if (parsedFromTable && parsedFromTable.length) {
      reviewEntries = parsedFromTable;
      reviewSource = 'table';
      docxLoading = false;
      render();
      return;
    }
    // No matching table — strip tags and try the free-form heuristic on the visible text
    const wrapper = document.createElement('div');
    wrapper.innerHTML = htmlText;
    const plainText = (wrapper.textContent || '').trim();
    const parsed = parseFreeformText(plainText);
    if (!parsed.length) {
      docxError = 'לא זוהו רשומות בקובץ. ייתכן שהמבנה לא נתמך על ידי הזיהוי האוטומטי המקומי — ניתן להזין ידנית.';
      docxLoading = false;
      render();
      return;
    }
    reviewEntries = parsed;
    reviewSource = 'freeform';
    docxLoading = false;
    render();
  }

  function readAsBinaryDocx(file) {
    const reader = new FileReader();
    reader.onload = () => {
      if (!window.mammoth) {
        docxError = 'ספריית קריאת הוורד לא נטענה (נדרש חיבור לאינטרנט בפעם הראשונה). רעני את הדף ונסי שוב.';
        docxLoading = false;
        render();
        return;
      }
      // First try: does this file contain a table matching our own export format?
      window.mammoth.convertToHtml({ arrayBuffer: reader.result })
        .then(result => {
          const parsedFromTable = tryParseOwnTable(result.value || '');
          if (parsedFromTable && parsedFromTable.length) {
            reviewEntries = parsedFromTable;
            reviewSource = 'table';
            docxLoading = false;
            render();
            return;
          }
          // Fallback: extract raw text and run the free-form heuristic parser
          window.mammoth.extractRawText({ arrayBuffer: reader.result })
            .then(r2 => {
              const text = (r2.value || '').trim();
              if (!text) {
                docxError = 'לא נמצא טקסט בקובץ הוורד.';
                docxLoading = false;
                render();
                return;
              }
              const parsed = parseFreeformText(text);
              if (!parsed.length) {
                docxError = 'לא זוהו רשומות בקובץ. ייתכן שהמבנה לא נתמך על ידי הזיהוי האוטומטי המקומי — ניתן להזין ידנית.';
                docxLoading = false;
                render();
                return;
              }
              reviewEntries = parsed;
              reviewSource = 'freeform';
              docxLoading = false;
              render();
            })
            .catch(() => {
              docxError = 'לא הצלחתי לקרוא את קובץ הוורד.';
              docxLoading = false;
              render();
            });
        })
        .catch(() => {
          docxError = 'לא הצלחתי לקרוא את קובץ הוורד. ודאי שזהו קובץ ‎.docx‏ תקין, או קובץ ‎.doc‏ שיוצא מהאפליקציה הזו.';
          docxLoading = false;
          render();
        });
    };
    reader.onerror = () => {
      docxError = 'קריאת קובץ הוורד נכשלה בדפדפן.';
      docxLoading = false;
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  // Parses a table matching our own export format: תאריך | שעה | פעילות | גורמים מעורבים | מסקנות / החלטות
  function tryParseOwnTable(htmlStr) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = htmlStr;
    const tables = Array.from(wrapper.querySelectorAll('table'));
    if (!tables.length) return null;

    // Find the table whose header row matches our expected columns (there may be
    // other tables in the document, e.g. the summary stats table in the export).
    let table = null;
    for (const t of tables) {
      const rows = t.querySelectorAll('tr');
      if (!rows.length) continue;
      const headerCells = Array.from(rows[0].querySelectorAll('th,td')).map(c => c.textContent.trim());
      if (headerCells[0] && headerCells[0].includes('תאריך') && headerCells.some(h => h.includes('פעילות'))) {
        table = t;
        break;
      }
    }
    if (!table) return null;
    const rows = Array.from(table.querySelectorAll('tr'));
    if (rows.length < 2) return null;

    // Detect whether this export includes a separate "end time" column (newer format)
    const headerCells0 = Array.from(rows[0].querySelectorAll('th,td')).map(c => c.textContent.trim());
    const hasEndTimeCol = headerCells0.some(h => h.includes('סיום'));

    const out = [];
    for (let i = 1; i < rows.length; i++) {
      const cells = Array.from(rows[i].querySelectorAll('td')).map(c => c.textContent.trim());
      if (!cells.length) continue;

      let dateDisp, time, endTime, activity, who, conclusions;
      if (hasEndTimeCol) {
        [dateDisp, time, endTime, activity, who, conclusions] = cells;
      } else {
        [dateDisp, time, activity, who, conclusions] = cells;
        endTime = '';
      }
      const m = (dateDisp || '').match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
      const isoDate = m ? normalizeDateToken(m[1], m[2], m[3]) : '';
      if (!isoDate && !activity) continue;
      out.push({
        id: uid(),
        selected: true,
        date: isoDate,
        time: (time && time !== '—') ? time : '',
        endTime: (endTime && endTime !== '—') ? endTime : '',
        activity: (activity && activity !== '—') ? activity : '',
        who: (who && who !== '—') ? who : '',
        conclusions: (conclusions && conclusions !== '—') ? conclusions : ''
      });
    }
    return out;
  }

  // Heuristic parser for free-form journal text:
  // date header lines (e.g. "8.7.26 (8 ביולי 2026)") followed by "HH:MM – activity" lines.
  function parseFreeformText(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const dateLineRe = /^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\s*(?:\(.*\))?$/;
    // Try a time RANGE first ("10:00-11:40 – ...."), then fall back to a single start time.
    const timeRangeLineRe = /^(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})\s*[-–—]\s*(.+)$/;
    const timeLineRe = /^(\d{1,2}):(\d{2})\s*[-–—]\s*(.+)$/;

    const out = [];
    let currentDate = '';
    let currentEntry = null;

    for (const line of lines) {
      const dm = line.match(dateLineRe);
      if (dm) {
        currentDate = normalizeDateToken(dm[1], dm[2], dm[3]);
        currentEntry = null;
        continue;
      }
      const trm = line.match(timeRangeLineRe);
      if (trm) {
        currentEntry = {
          id: uid(),
          selected: true,
          date: currentDate,
          time: `${trm[1].padStart(2, '0')}:${trm[2]}`,
          endTime: `${trm[3].padStart(2, '0')}:${trm[4]}`,
          activity: trm[5].trim(),
          who: '',
          conclusions: ''
        };
        out.push(currentEntry);
        continue;
      }
      const tm = line.match(timeLineRe);
      if (tm) {
        currentEntry = {
          id: uid(),
          selected: true,
          date: currentDate,
          time: `${tm[1].padStart(2, '0')}:${tm[2]}`,
          endTime: '',
          activity: tm[3].trim(),
          who: '',
          conclusions: ''
        };
        out.push(currentEntry);
        continue;
      }
      // Continuation line (doesn't match date or time pattern): attach to the previous entry, if any
      if (currentEntry) {
        currentEntry.activity += ' ' + line;
      }
      // else: line before any recognized entry (e.g. "בס"ד") — ignored
    }
    return out.filter(e => e.date && e.activity);
  }

  function toggleReviewEntry(id) {
    if (!reviewEntries) return;
    const e = reviewEntries.find(r => r.id === id);
    if (e) e.selected = !e.selected;
    render();
  }

  function cancelReview() {
    reviewEntries = null;
    docxFileName = null;
    render();
  }

  function commitReviewEntries() {
    if (!reviewEntries) return;
    const chosen = reviewEntries.filter(r => r.selected && r.date && r.activity);
    if (chosen.length === 0) {
      docxError = 'לא נבחרו רשומות תקינות (חובה תאריך ופעילות).';
      render();
      return;
    }
    chosen.forEach(r => {
      entries.push({ id: uid(), date: r.date, time: r.time, endTime: r.endTime, activity: r.activity, who: r.who, conclusions: r.conclusions });
    });
    saveEntries();
    reviewEntries = null;
    docxFileName = null;
    setStatus(`נוספו ${chosen.length} רשומות מהקובץ ✓`, false);
    render();
  }

  // ---- Voice dictation (Web Speech API) ----
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let activeRecognition = null;
  let activeMicBtn = null;

  function setMicStatus(msg, isError) {
    const el = document.getElementById('mic-status');
    if (!el) return;
    el.textContent = msg || '';
    el.className = 'ocr-status' + (isError ? ' error' : '');
  }

  function stopActiveRecording() {
    if (activeRecognition) {
      try { activeRecognition.stop(); } catch (e) {}
    }
  }

  function startRecording(targetId, btn) {
    if (!SpeechRecognitionCtor) {
      setMicStatus('הקלטה קולית לא נתמכת בדפדפן הזה. אפשר להשתמש באייקון המיקרופון של מקלדת הטלפון בתוך השדה.', true);
      return;
    }
    // If already recording on another field, stop it first
    if (activeRecognition) {
      stopActiveRecording();
    }

    const recognition = new SpeechRecognitionCtor();
    recognition.lang = 'he-IL';
    recognition.interimResults = false;
    recognition.continuous = true;

    const field = document.getElementById(targetId);
    const startingValue = field ? field.value : '';

    activeRecognition = recognition;
    activeMicBtn = btn;
    btn.classList.add('recording');
    btn.textContent = '⏹';
    setMicStatus('מקליט… לחצי שוב על המיקרופון כדי לעצור.', false);

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      if (field) {
        const sep = startingValue && !startingValue.endsWith(' ') ? ' ' : '';
        field.value = (startingValue + sep + transcript).trim();
        saveDraft();
      }
    };

    recognition.onerror = (event) => {
      const reasons = {
        'not-allowed': 'הגישה למיקרופון נחסמה. יש לאשר הרשאת מיקרופון בדפדפן.',
        'no-speech': 'לא זוהה דיבור. נסי שוב.',
        'audio-capture': 'לא נמצא מיקרופון זמין במכשיר.',
        'service-not-allowed': 'זיהוי הדיבור חסום בדפדפן זה (נפוץ ב-iPhone/Safari). אפשר להשתמש באייקון המיקרופון שבמקלדת עצמה במקום.'
      };
      setMicStatus(reasons[event.error] || ('שגיאת הקלטה: ' + event.error), true);
      resetMicButton();
    };

    recognition.onend = () => {
      resetMicButton();
      setMicStatus('', false);
    };

    try {
      recognition.start();
    } catch (e) {
      setMicStatus('לא ניתן להפעיל הקלטה: ' + e.message, true);
      resetMicButton();
    }
  }

  function resetMicButton() {
    if (activeMicBtn) {
      activeMicBtn.classList.remove('recording');
      activeMicBtn.textContent = '🎤';
    }
    activeRecognition = null;
    activeMicBtn = null;
  }

  function handleMicClick(btn) {
    const targetId = btn.dataset.target;
    if (activeRecognition && activeMicBtn === btn) {
      stopActiveRecording();
      return;
    }
    startRecording(targetId, btn);
  }

  function render() {
    if (!loaded) {
      root.innerHTML = `<div class="loading">טוען יומן עבודה…</div>`;
      return;
    }

    const list = sortedEntries();

    const topWho = getFrequentWho(6);
    const quickChipsHtml = !editingId ? `
      <div class="quick-row">
        ${topWho.map(name => `<button type="button" class="quick-chip" data-quick-who="${escapeHtml(name)}">👤 ${escapeHtml(name)}</button>`).join('')}
        ${entries.length ? `<button type="button" class="quick-chip duplicate" id="duplicate-last-btn">⧉ שכפול הרשומה האחרונה</button>` : ''}
      </div>` : '';

    const summaryBarHtml = list.length ? `
      <div class="summary-bar">
        <div class="summary-pill"><b>${list.length}</b>רשומות</div>
        <div class="summary-pill"><b>${fmtDateDisplay(list[0].date)} – ${fmtDateDisplay(list[list.length - 1].date)}</b>טווח תאריכים</div>
        <div class="summary-pill"><b>${getAllWhoTokens().length}</b>גורמים מעורבים</div>
      </div>` : '';

    const monthKeys = Array.from(new Set(list.map(e => getMonthKey(e.date)).filter(Boolean))).sort();
    const activeMonthFilter = monthKeys.includes(monthFilter) ? monthFilter : 'all';
    const visibleList = activeMonthFilter === 'all' ? list : list.filter(e => getMonthKey(e.date) === activeMonthFilter);
    const monthFilterHtml = monthKeys.length ? `
      <select id="month-filter-select" class="month-filter-select">
        <option value="all" ${activeMonthFilter === 'all' ? 'selected' : ''}>כל החודשים</option>
        ${monthKeys.map(k => `<option value="${k}" ${activeMonthFilter === k ? 'selected' : ''}>${monthLabel(k)}</option>`).join('')}
      </select>` : '';
    const visibleRowsHtml = visibleList.map(e => `
      <tr class="${e.id === editingId ? 'editing-row' : ''}">
        <td class="col-date">${escapeHtml(fmtDateDisplay(e.date))}</td>
        <td class="col-time">${escapeHtml(e.time || '—')}</td>
        <td class="col-time">${escapeHtml(e.endTime || '—')}</td>
        <td>${escapeHtml(e.activity)}</td>
        <td>${escapeHtml(e.who || '—')}</td>
        <td>${escapeHtml(e.conclusions || '—')}</td>
        <td class="col-actions">
          <button class="edit-btn" data-id="${e.id}" title="עריכה">✎</button>
          <button class="del-btn" data-id="${e.id}" title="מחיקה">✕</button>
        </td>
      </tr>`).join('');

    root.innerHTML = `
      <div class="wrap">
        <div class="masthead">
          <div>
            <h1>יומן עבודה</h1>
            <p>הכנת שנת הלימודים תשפ״ז &nbsp;·&nbsp; ${list.length} רשומות ${fbEnabled ? `&nbsp;·&nbsp; <span id="sync-badge" class="sync-badge sync-${syncState}">${syncBadgeText(syncState)}</span>` : ''}</p>
          </div>
          <div class="masthead-actions">
            <button class="export-btn" id="export-data-btn" ${list.length ? '' : 'disabled'} title="שומר עותק של הקובץ עם כל הנתונים בתוכו — אפשר לשלוח אותו במייל או להעביר לנייד">💾 שמור קובץ עם נתונים</button>
            <button class="export-btn" id="export-btn" ${list.length ? '' : 'disabled'}>⬇ ייצוא לוורד</button>
          </div>
        </div>

        ${summaryBarHtml}

        ${(() => {
          const days = getDaysSinceBackup();
          if (backupReminderDismissed || days === null || days < 2) return '';
          return `
        <div class="card seed-banner">
          <p>לא גיבית קובץ נתונים כבר ${days} ימים. מומלץ לייצא עותק גיבוי כדי לא לאבד רשומות אם משהו יקרה לדפדפן.</p>
          <div style="display:flex; gap:10px;">
            <button class="commit-btn" id="backup-now-btn">💾 ייצא עכשיו</button>
            <button class="commit-btn" id="dismiss-backup-btn" style="background:#8a94a6;">דחה להיום</button>
          </div>
        </div>`;
        })()}

        <div class="card" id="entry-form-card">
          <h2>${editingId ? 'עריכת רשומה' : 'הוספת רשומה'}</h2>
          <div id="save-reminder-banner" class="save-reminder"></div>
          ${quickChipsHtml}
          <div class="form-grid">
            <div class="full datetime-row">
              <div>
                <label for="f-date">תאריך</label>
                <input type="date" id="f-date">
              </div>
              <div>
                <label for="f-time">שעת התחלה</label>
                <div class="time-with-now">
                  <input type="time" id="f-time">
                  <button type="button" class="now-btn" data-time-target="f-time">עכשיו</button>
                </div>
              </div>
              <div>
                <label for="f-end-time">שעת סיום</label>
                <div class="time-with-now">
                  <input type="time" id="f-end-time">
                  <button type="button" class="now-btn" data-time-target="f-end-time">עכשיו</button>
                </div>
              </div>
            </div>
            <div class="full">
              <label for="f-activity">פעילות</label>
              <div class="field-with-mic">
                <textarea id="f-activity" placeholder="מה עשית..."></textarea>
                <button type="button" class="mic-btn" data-target="f-activity" title="הקלטת דיבור">🎤</button>
              </div>
            </div>
            <div>
              <label for="f-who">גורמים מעורבים</label>
              <div class="field-with-mic">
                <input type="text" id="f-who" placeholder="שמות המעורבים" list="who-suggestions">
                <button type="button" class="mic-btn" data-target="f-who" title="הקלטת דיבור">🎤</button>
              </div>
              <datalist id="who-suggestions">${getAllWhoTokens().map(n => `<option value="${escapeHtml(n)}">`).join('')}</datalist>
            </div>
            <div>
              <label for="f-conclusions">מסקנות / החלטות</label>
              <div class="field-with-mic">
                <input type="text" id="f-conclusions" placeholder="מה סוכם או הוחלט">
                <button type="button" class="mic-btn" data-target="f-conclusions" title="הקלטת דיבור">🎤</button>
              </div>
            </div>
          </div>
          <div id="mic-status" class="ocr-status"></div>
          <div class="add-row">
            <button class="add-btn" id="add-btn">${editingId ? '✓ עדכן רשומה' : '+ הוסף רשומה'}</button>
            ${editingId ? '<button class="cancel-btn" id="cancel-btn">ביטול</button>' : ''}
          </div>
          <div class="status-msg" id="status-msg"></div>
        </div>

        <div class="card">
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom: 12px;">
            <h2 style="margin:0;">הרשומות שלי</h2>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              ${monthFilterHtml}
              <button class="export-btn secondary-btn" id="export-month-btn" data-month="${activeMonthFilter}" ${visibleList.length ? '' : 'disabled'} title="${activeMonthFilter !== 'all' ? `ייצוא לוורד רק של ${monthLabel(activeMonthFilter)}` : 'ייצוא כל הרשומות (כל החודשים) לוורד'}">⬇ ייצוא ${activeMonthFilter !== 'all' ? monthLabel(activeMonthFilter) : 'כל החודשים'} לוורד</button>
            </div>
          </div>
          ${visibleList.length ? `
          <table>
            <thead>
              <tr><th>תאריך</th><th>שעת התחלה</th><th>שעת סיום</th><th>פעילות</th><th>גורמים מעורבים</th><th>מסקנות / החלטות</th><th></th></tr>
            </thead>
            <tbody>${visibleRowsHtml}</tbody>
          </table>` : `<div class="empty-state">${list.length ? 'אין רשומות בחודש שנבחר.' : 'עדיין אין רשומות. הוסיפי את הפעילות הראשונה למעלה.'}</div>`}
        </div>

        <div class="card" id="analysis-card">
          <h2>ניתוח וסיכום</h2>
          <div class="analysis-controls">
            <button class="export-btn secondary-btn" id="quick-analysis-btn" ${list.length ? '' : 'disabled'}>⚡ משימות פתוחות (מהיר)</button>
          </div>
          ${analysisError ? `<div class="analysis-error">${escapeHtml(analysisError)}</div>` : ''}
          <div id="analysis-result">${analysisResultHtml}</div>
          ${analysisResultText ? `
          <label class="analysis-checkbox-row">
            <input type="checkbox" id="include-analysis-checkbox" ${includeAnalysisInExport ? 'checked' : ''}>
            לצרף את הניתוח האחרון כנספח לייצוא לוורד
          </label>` : ''}
        </div>

        <div class="card upload-card">
          <h2>ייבוא רשומות מקובץ Word</h2>
          <p style="font-size:13px;color:var(--muted);margin-top:-4px;">
            עובד גם על קובץ שיוצא מהאפליקציה הזו (זיהוי מדויק) וגם על יומן חופשי בפורמט "תאריך" ואז שורות "שעה – פעילות" (זיהוי משוער — כדאי לבדוק את התוצאה לפני האישור).
          </p>

          <button class="export-btn secondary-btn" id="import-seed-btn" ${seedBannerEntries ? '' : 'disabled'} title="${seedBannerEntries ? `הקובץ מכיל ${seedBannerEntries.length} רשומות מובנות — לחצי לייבוא` : 'זמין רק כשקובץ ה-HTML שנפתח מכיל נתונים מובנים לייבוא'}" style="margin-bottom:14px;">📥 ייבוא נתונים מהקובץ</button>

          <div class="upload-block">
            <div class="upload-row">
              <input type="file" id="docx-file-input" accept=".docx,.doc">
              ${docxFileName ? `<span class="ocr-status">${escapeHtml(docxFileName)}${docxLoading ? ' — קורא…' : ''}</span>` : ''}
            </div>
            ${docxError ? `<div class="ocr-status error">${escapeHtml(docxError)}</div>` : ''}
          </div>

          ${reviewEntries ? `
          <div class="review-table-wrap">
            <p style="font-size:12.5px;color:var(--muted);">
              ${reviewSource === 'table' ? 'זוהתה טבלה בפורמט המוכר — ' : 'זיהוי משוער מתוך טקסט חופשי — כדאי לעבור ולוודא לפני האישור — '}
              נמצאו ${reviewEntries.length} רשומות.
            </p>
            <table>
              <thead>
                <tr><th></th><th>תאריך</th><th>שעת התחלה</th><th>שעת סיום</th><th>פעילות</th><th>גורמים מעורבים</th><th>מסקנות</th></tr>
              </thead>
              <tbody>
                ${reviewEntries.map(r => `
                <tr>
                  <td class="col-check"><input type="checkbox" data-review-id="${r.id}" ${r.selected ? 'checked' : ''}></td>
                  <td>${escapeHtml(fmtDateDisplay(r.date))}</td>
                  <td>${escapeHtml(r.time || '—')}</td>
                  <td>${escapeHtml(r.endTime || '—')}</td>
                  <td>${escapeHtml(r.activity)}</td>
                  <td>${escapeHtml(r.who || '—')}</td>
                  <td>${escapeHtml(r.conclusions || '—')}</td>
                </tr>`).join('')}
              </tbody>
            </table>
            <div style="display:flex; gap:10px;">
              <button class="commit-btn" id="commit-btn">הוסף את הרשומות המסומנות ליומן</button>
              <button class="commit-btn" id="cancel-review-btn" style="background:#8a94a6;">בטל</button>
            </div>
          </div>` : ''}
        </div>
      </div>
    `;

    document.getElementById('add-btn').addEventListener('click', addEntry);
    document.getElementById('cancel-btn')?.addEventListener('click', cancelEdit);
    document.getElementById('export-btn')?.addEventListener('click', () => exportToWord());
    document.getElementById('export-data-btn')?.addEventListener('click', exportAppWithData);
    document.getElementById('import-seed-btn')?.addEventListener('click', importSeedBanner);
    document.getElementById('backup-now-btn')?.addEventListener('click', exportAppWithData);
    document.getElementById('dismiss-backup-btn')?.addEventListener('click', dismissBackupReminder);
    document.getElementById('docx-file-input')?.addEventListener('change', (ev) => handleDocxSelect(ev.target));
    document.getElementById('commit-btn')?.addEventListener('click', commitReviewEntries);
    document.getElementById('cancel-review-btn')?.addEventListener('click', cancelReview);
    root.querySelectorAll('[data-review-id]').forEach(cb => {
      cb.addEventListener('change', () => toggleReviewEntry(cb.dataset.reviewId));
    });
    root.querySelectorAll('.mic-btn').forEach(btn => {
      btn.addEventListener('click', () => handleMicClick(btn));
    });
    root.querySelectorAll('[data-time-target]').forEach(btn => {
      btn.addEventListener('click', () => setTimeNow(btn.dataset.timeTarget));
    });
    root.querySelectorAll('[data-quick-who]').forEach(btn => {
      btn.addEventListener('click', () => applyQuickWho(btn.dataset.quickWho));
    });
    document.getElementById('duplicate-last-btn')?.addEventListener('click', duplicateLastEntry);
    document.getElementById('month-filter-select')?.addEventListener('change', (ev) => setMonthFilter(ev.target.value));
    document.getElementById('export-month-btn')?.addEventListener('click', (ev) => exportToWord(ev.currentTarget.dataset.month));
    document.getElementById('quick-analysis-btn')?.addEventListener('click', runQuickAnalysis);
    document.getElementById('include-analysis-checkbox')?.addEventListener('change', (ev) => toggleIncludeAnalysis(ev.target.checked));
    DRAFT_FIELD_IDS.forEach(id => {
      document.getElementById(id)?.addEventListener('input', saveDraft);
    });
    root.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteEntry(btn.dataset.id));
    });
    root.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => startEdit(btn.dataset.id));
    });

    const dateInput = document.getElementById('f-date');
    if (dateInput && !dateInput.value) {
      dateInput.value = new Date().toISOString().slice(0, 10);
    }
  }

  loadEntries();
  restoreDraftIfAny();

  window.addEventListener('beforeunload', (ev) => {
    const activity = document.getElementById('f-activity')?.value || '';
    const who = document.getElementById('f-who')?.value || '';
    const conclusions = document.getElementById('f-conclusions')?.value || '';
    if (!editingId && (activity.trim() || who.trim() || conclusions.trim())) {
      ev.preventDefault();
      ev.returnValue = '';
    }
  });
})();
</script></body></html>
